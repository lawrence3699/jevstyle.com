name: Check public pages

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build People Search
        run: npm ci --prefix frontend/people && npm test --prefix frontend/people && npm run build --prefix frontend/people
      - name: Verify reproducible pages and links
        run: |
          bash scripts/check_all.sh
          git diff --exit-code -- index.html zh about contact privacy pricing updates use-cases guides models benchmarks api sitemap.xml llms.txt tools/browser-agent assets/home.js assets/home.css assets/page-dates.json 404.html
