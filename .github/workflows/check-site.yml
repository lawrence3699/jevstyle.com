name: Check public pages

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reproducible pages and links
        run: |
          python3 scripts/prerender_home.py
          python3 scripts/build_discovery.py
          python3 scripts/check_site.py
          git diff --exit-code -- index.html zh/index.html about zh/about use-cases guides models benchmarks api sitemap.xml llms.txt
