name: Deploy site with fresh Hugging Face stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Hugging Face stats into stats.json
        run: |
          python3 - <<'EOF'
          import json, datetime, urllib.request
          url = ("https://huggingface.co/api/models?author=chaoliangUNSW&limit=200"
                 "&expand[]=downloads&expand[]=downloadsAllTime&expand[]=likes&expand[]=createdAt")
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  data = json.load(r)
          except Exception as e:
              print("stats fetch failed, page keeps its built-in snapshot:", e)
              raise SystemExit(0)
          keep = ("id", "downloads", "downloadsAllTime", "likes", "createdAt")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                 "models": [{k: m.get(k) for k in keep} for m in data]}
          with open("stats.json", "w") as f:
              json.dump(out, f, indent=1)
          print(len(data), "repos,", sum(m.get("downloadsAllTime") or 0 for m in data), "all-time downloads")
          EOF
      - name: Build People Search
        run: npm ci --prefix frontend/people && npm test --prefix frontend/people && npm run build --prefix frontend/people
      - name: Prerender and validate public pages
        run: |
          python3 scripts/prerender_home.py
          python3 scripts/build_site.py
          python3 scripts/build_routing_experiment.py
          python3 scripts/build_discovery.py
          python3 scripts/check_site.py
          python3 scripts/test_geo_snapshot.py
          python3 scripts/test_append_geo_run.py
          python3 scripts/test_search_collector.py
          python3 scripts/test_discovery_audit.py
          node scripts/check_search_performance.cjs
          node scripts/check_search_performance_auto.cjs
          node scripts/check_search_monitor.cjs
          node scripts/check_admin_gate.cjs
          node --check admin/discovery.js
          node --check admin/search-performance.js
          node --check admin/search-monitor.js
          node --check admin/experiments.js
      - name: Exclude development dependencies from publication
        run: rm -rf frontend/people/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
