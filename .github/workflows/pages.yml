name: Deploy site with fresh Hugging Face stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: After deploy, send every sitemap URL to IndexNow
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Hugging Face stats into stats.json
        run: |
          python3 - <<'EOF'
          import json, datetime, urllib.request
          url = ("https://huggingface.co/api/models?author=chaoliangUNSW&limit=200"
                 "&expand[]=downloads&expand[]=downloadsAllTime&expand[]=likes&expand[]=createdAt")
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  data = json.load(r)
          except Exception as e:
              print("stats fetch failed, page keeps its built-in snapshot:", e)
              raise SystemExit(0)
          keep = ("id", "downloads", "downloadsAllTime", "likes", "createdAt")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                 "models": [{k: m.get(k) for k in keep} for m in data]}
          with open("stats.json", "w") as f:
              json.dump(out, f, indent=1)
          print(len(data), "repos,", sum(m.get("downloadsAllTime") or 0 for m in data), "all-time downloads")
          EOF
      - name: Build People Search
        run: npm ci --prefix frontend/people && npm test --prefix frontend/people && npm run build --prefix frontend/people
      - name: Prerender and validate public pages
        run: bash scripts/check_all.sh
      - name: Copy only the public site into _site
        # Build scripts, internal docs, frontend sources and git metadata stay out of the published artifact.
        run: |
          rsync -a --delete \
            --exclude='/.git*' --exclude='/_site/' --exclude='/docs/' --exclude='/scripts/' \
            --exclude='/frontend/' --exclude='node_modules/' \
            ./ _site/
          test -f _site/index.html && test -f _site/tools/people-search/index.html && test -f _site/favicon.ico
          ! test -e _site/scripts && ! test -e _site/docs && ! test -e _site/frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell IndexNow about changed pages
        # Search engines that support IndexNow (Bing, Yandex and others) hear about new or changed pages.
        # Scheduled stats refreshes do not change page dates, so they send nothing.
        if: github.event_name == 'push' || inputs.indexnow_all
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            python3 scripts/notify_indexnow.py --changed-since "$BEFORE" --submit
          else
            python3 scripts/notify_indexnow.py --submit
          fi
